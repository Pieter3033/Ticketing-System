<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pulsit Time Schedule</title>
  <link rel="stylesheet" href="styles.css"><link rel="icon" href="assets/favicon.png">
  <script src="session_guard.js?v=20261012-session-fix" defer></script><script src="time_schedule.js?v=20261012-session-fix" defer></script>
</head>
<body>
  <div class="schedule-page-shell">
    <header class="schedule-page-header">
      <a href="index.html" class="schedule-back-link">← Tickets</a>
      <div><span class="manager-dashboard-eyebrow">Settings</span><h1>My Time Schedule</h1><p>Capture one work schedule for each day.</p></div>
      <div class="user-summary"><span id="scheduleUserAvatar" class="avatar">--</span><strong id="scheduleUserName">Loading...</strong></div>
    </header>
    <main class="schedule-page-content" id="schedulePage" hidden>
      <section class="schedule-form-card">
        <h2>Capture schedule</h2>
        <form id="scheduleForm">
          <label><span>Date</span><input type="date" name="schedule_date" required></label>
          <label><span>Start time</span><input type="time" name="start_time" required></label>
          <label><span>End time</span><input type="time" name="end_time" required></label>
          <label><span>Break (minutes)</span><input type="number" name="break_minutes" min="0" step="1" value="60" required></label>
          <label class="schedule-notes"><span>Notes</span><textarea name="notes" maxlength="1000" placeholder="Optional notes"></textarea></label>
          <button class="submit" type="submit">Save schedule</button>
        </form>
        <div id="scheduleNotice" class="notice" hidden></div>
      </section>
      <section class="schedule-history-card"><h2>My captured days</h2><div class="table-scroll"><table><thead><tr><th>Date</th><th>Start</th><th>End</th><th>Break</th><th>Working time</th><th>Notes</th><th></th></tr></thead><tbody id="scheduleRows"></tbody></table></div></section>
    </main>
    <section id="scheduleDenied" class="schedule-denied" hidden><h1>Access unavailable</h1><p>Time schedules are limited to user type 7.</p><a href="index.html">Return to tickets</a></section>
  </div>
</body></html>
